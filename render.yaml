services:
  - type: web
    name: ma-api
    runtime: python
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ALLOW_ALL_ORIGINS
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_ORIGINS
        value: https://ma-two-pearl.vercel.app
      - key: FRONTEND_ORIGIN_REGEX
        value: ^https?://([a-z0-9-]+\.vercel\.app|localhost|127\.0\.0\.1)(:\d+)?$
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ma-db
          property: connectionString

databases:
  - name: ma-db
    plan: free
