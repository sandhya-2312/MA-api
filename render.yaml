services:
  - type: web
    name: ma-api
    runtime: python
    plan: free
    buildCommand: ./scripts/render-build.sh
    startCommand: ./scripts/render-start.sh
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: ALLOW_ALL_ORIGINS
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ma-db
          property: connectionString

databases:
  - name: ma-db
    plan: free
